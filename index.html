<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSI NIT editor</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#d6dae1;--ac:#2563eb;--ac2:#e8f0fe;--bad:#c62828;--ok:#2e7d32}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d222a;--tx:#e6e9ef;--mu:#9aa4b2;--bd:#343b47;--ac:#6ea0ff;--ac2:#22304d;--bad:#ff7b72;--ok:#6fcf7f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 auto 0 0}
main{max-width:1000px;margin:0 auto;padding:16px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
input,select{min-width:0}button{cursor:pointer}button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.x{color:var(--bad)}
.s{padding:2px 7px}
#start{margin:12vh auto 0;max-width:520px;text-align:center;border:2px dashed var(--bd);border-radius:14px;padding:44px 24px;background:var(--card)}
#start.drag{border-color:var(--ac);background:var(--ac2)}#start p{color:var(--mu)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
label input,label select{color:var(--tx);font-size:14px}
.w{width:90px}.w2{width:130px}.w3{width:220px}
details{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin:6px 0}
summary{padding:8px 12px;cursor:pointer;display:flex;gap:14px;align-items:center}
summary b{min-width:90px}summary span{color:var(--mu)}summary .sp{margin-left:auto}
.body{padding:4px 12px 12px;border-top:1px solid var(--bd)}
.d{border:1px solid var(--bd);border-radius:6px;padding:8px;margin-top:8px}
.d h4{margin:0 0 6px;font-size:12px;color:var(--mu);display:flex;gap:8px;align-items:center}
.d h4 .sp{margin-left:auto}
table{border-collapse:collapse}td{padding:2px 4px 2px 0}
.hex{font-family:ui-monospace,monospace;width:100%}
.dup{background:var(--ac2);border-color:var(--bad)!important}
.bad{border-color:var(--bad)!important}.msg{font-size:12px}.ok{color:var(--ok)}.er{color:var(--bad)}
.hid{display:none}
</style></head><body>
<header><h1>PSI / NIT editor</h1><span id="fn" class="msg"></span>
<button id="bimp">Import…</button><button id="bexp" class="p hid">Export</button></header>
<input type="file" id="file" accept=".psi,.txt,*/*" class="hid">
<main>
<div id="start"><h2 style="margin-top:0">Start by importing a file</h2>
<p>Drop an exported <code>*.psi</code> file (NIT from Luminato) here, or choose it.</p>
<button class="p" id="bimp2">Choose file…</button></div>
<div id="ed" class="hid"></div>
</main>
<script>
//LOGIC
const H=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
const B=h=>{h=h.replace(/[\s,]/g,'');if(!/^([0-9a-f]{2})*$/i.test(h))throw new Error('hex');return Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16))};
function crc32(d){let c=0xFFFFFFFF;for(const x of d){c^=x<<24;for(let i=0;i<8;i++)c=(c&0x80000000)?((c<<1)^0x04C11DB7):(c<<1);c>>>=0}return c>>>0}
const PFX='PSI/SI TABLE:0x';
const DN={0x40:'network_name',0x41:'service_list',0x44:'cable_delivery_system',0x5F:'private_data_specifier',0x83:'logical_channel_descriptor (EACEM LCN)',0x4A:'linkage',0x4B:'nvod_ref',0x5A:'terrestrial_delivery',0x62:'frequency_list',0x6C:'cell_list'};
const ST={1:'SD MPEG-2 TV',2:'Radio',3:'Teletext',0x0A:'Adv.codec radio',0x11:'MPEG-2 HD TV',0x16:'SD AVC TV',0x17:'NVOD SD AVC',0x19:'HD AVC TV',0x1F:'UHD / HEVC'};
const MOD={1:'16-QAM',2:'32-QAM',3:'64-QAM',4:'128-QAM',5:'256-QAM'};
function decDesc(t,d){
 if(t===0x40)return{t,name:String.fromCharCode(...d)};
 if(t===0x41&&d.length%3===0){const s=[];for(let i=0;i<d.length;i+=3)s.push([d[i]<<8|d[i+1],d[i+2]]);return{t,s}}
 if(t===0x83&&d.length%4===0){const l=[];for(let i=0;i<d.length;i+=4)l.push([d[i]<<8|d[i+1],d[i+2]>>7,(d[i+2]&3)<<8|d[i+3],d[i+2]>>2&31]);return{t,l}}
 if(t===0x44&&d.length===11){const bcd=H(d.slice(0,4)),sr=H(d.slice(7,10))+(d[10]>>4).toString(16);
  return{t,f:String(parseInt(bcd,10)/1e4),res:(d[4]<<4)|(d[5]>>4),fo:d[5]&15,mod:d[6],sr:String(parseInt(sr,10)/1e4),fi:d[10]&15}}
 return{t,hex:H(d)}}
function encDesc(x){let d;
 if(x.t===0x40)d=Uint8Array.from(x.name,c=>c.charCodeAt(0)&255);
 else if(x.s)d=Uint8Array.from(x.s.flatMap(([a,b])=>[a>>8&255,a&255,b&255]));
 else if(x.l)d=Uint8Array.from(x.l.flatMap(([a,v,n,r])=>[a>>8&255,a&255,v<<7|r<<2|(n>>8&3),n&255]));
 else if(x.t===0x44&&x.f!==undefined){const f=String(Math.round(parseFloat(x.f)*1e4)).padStart(8,'0'),sr=String(Math.round(parseFloat(x.sr)*1e4)).padStart(7,'0');
  d=Uint8Array.from([...B(f),x.res>>4&255,(x.res&15)<<4|x.fo&15,x.mod,...B(sr.slice(0,6)),parseInt(sr[6],10)<<4|x.fi&15])}
 else d=B(x.hex);
 if(d.length>255)throw new Error('Descriptor 0x'+x.t.toString(16)+' is longer than 255 bytes');
 return[x.t,d.length,...d]}
function parseDescs(b){const r=[];for(let i=0;i+2<=b.length;){const l=b[i+1];r.push(decDesc(b[i],b.slice(i+2,i+2+l)));i+=2+l}return r}
const encDescs=a=>a.flatMap(encDesc);
function parsePsi(text){
 const m=text.match(/PSI\/SI TABLE:0x([0-9a-f]+)/i);if(!m)throw new Error('Header "PSI/SI TABLE:0x…" not found');
 const all=B(m[1]);let lead=1,warn=[];
 const secs=off=>{const r=[];for(let i=off;i+3<=all.length;){const L=(all[i+1]&15)<<8|all[i+2],s=all.slice(i,i+3+L);if(s.length<3+L)throw new Error('Truncated section');r.push(s);i+=3+L}return r};
 let S;try{S=secs(1);if(!S.length||crc32(S[0])!==0)throw 0}catch(e){lead=0;S=secs(0)}
 if(!S.length)throw new Error('No sections found');
 const o={lead,tid:S[0][0],nid:S[0][3]<<8|S[0][4],ver:S[0][5]>>1&31,cni:S[0][5]&1,netDescs:null,ts:[],warn};
 S.forEach((s,k)=>{
  if(crc32(s)!==0)warn.push('Section '+k+' CRC mismatch');
  const nl=(s[8]&15)<<8|s[9];let p=10;
  if(!o.netDescs)o.netDescs=parseDescs(s.slice(p,p+nl));p+=nl;
  const tl=(s[p]&15)<<8|s[p+1];p+=2;const e=p+tl;
  while(p<e){const dl=(s[p+4]&15)<<8|s[p+5];o.ts.push({tsid:s[p]<<8|s[p+1],onid:s[p+2]<<8|s[p+3],sec:k,descs:parseDescs(s.slice(p+6,p+6+dl))});p+=6+dl}});
 return o}
function buildPsi(o){
 const nd=encDescs(o.netDescs),ents=o.ts.map(t=>{const d=encDescs(t.descs);return{sec:t.sec,b:[t.tsid>>8&255,t.tsid&255,t.onid>>8&255,t.onid&255,0xF0|d.length>>8,d.length&255,...d]}});
 const groups=[];const idx=[...new Set(ents.map(e=>e.sec))].sort((a,b)=>a-b);
 if(!idx.length)idx.push(0);
 const MAX=1021-(5+2+nd.length+2+4);
 for(const k of idx){let cur=[],n=0;for(const e of ents.filter(e=>e.sec===k)){if(cur.length&&n+e.b.length>MAX){groups.push(cur);cur=[];n=0}cur.push(e);n+=e.b.length}groups.push(cur)}
 const out=[];
 groups.forEach((g,i)=>{const tl=g.reduce((a,e)=>a+e.b.length,0),L=5+2+nd.length+2+tl+4;
  if(L>1021)throw new Error('Network descriptors do not fit into a section');
  const s=[o.tid,0xF0|L>>8,L&255,o.nid>>8&255,o.nid&255,0xC0|o.ver<<1|o.cni,i,groups.length-1,0xF0|nd.length>>8,nd.length&255,...nd,0xF0|tl>>8,tl&255,...g.flatMap(e=>e.b)];
  const c=crc32(Uint8Array.from(s));out.push(...s,c>>>24,c>>16&255,c>>8&255,c&255)});
 return PFX+(o.lead?o.tid.toString(16).padStart(2,'0').toUpperCase():'')+H(out)+'\n'}
//UI
let M=null,fname='nit.psi';const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hx=n=>'0x'+n.toString(16).toUpperCase();
function inp(path,val,cls='w',type='text'){return`<input class="${cls}" data-p="${path}" data-k="${type}" value="${esc(val)}">`}
const SPEC={'00000028':'EACEM','00000029':'NorDig'};
function dRender(x,base,rm,warn){const nm=(DN[x.t]||'unknown')+(x.t===0x5F&&SPEC[(x.hex||'').toUpperCase()]?' · '+SPEC[x.hex.toUpperCase()]:'');
 let b;
 if(x.t===0x40&&x.name!==undefined)b=inp(base+'.name',x.name,'w3');
 else if(x.s){b='<table>'+x.s.map(([a,t],i)=>`<tr><td>SID ${inp(`${base}.s.${i}.0`,a,'w','int')}</td><td><select data-p="${base}.s.${i}.1" data-k="int">${(ST[t]?'':`<option value="${t}" selected>${hx(t)}</option>`)+Object.entries(ST).map(([k,v])=>`<option value="${k}"${+k===t?' selected':''}>${hx(+k)} ${v}</option>`).join('')}</select></td><td><button class="s x" data-a="rmsvc" data-b="${base}" data-i="${i}">✕</button></td></tr>`).join('')+`</table><button class="s" data-a="addsvc" data-b="${base}">+ service</button>`}
 else if(x.l){b=(warn?'<div class="msg er" style="margin-bottom:6px">⚠ This transponder has no private_data_specifier 0x00000028 (EACEM) before the LCN descriptor — receivers may ignore the LCN.</div>':'')+'<table><tr class="msg"><td>SID</td><td>Visible</td><td>LCN</td><td></td></tr>'+x.l.map(([a,v,n],i)=>`<tr><td>${inp(`${base}.l.${i}.0`,a,'w','int')}</td><td><input type="checkbox" data-p="${base}.l.${i}.1" data-k="chk"${v?' checked':''}></td><td>${inp(`${base}.l.${i}.2`,n,'w lcn','lcn')}</td><td><button class="s x" data-a="rmlcn" data-b="${base}" data-i="${i}">✕</button></td></tr>`).join('')+`</table><div class="row"><button class="s" data-a="addlcn" data-b="${base}">+ entry</button><button class="s" data-a="lcnfill" data-b="${base}" title="Add missing SIDs from the service list (0x41) with the first free LCNs">↓ SIDs from service list</button></div>`}
 else if(x.f!==undefined){b=`<div class="row"><label>Frequency, MHz${inp(base+'.f',x.f,'w2','float')}</label><label>Modulation<select data-p="${base}.mod" data-k="int">${(MOD[x.mod]?'':`<option value="${x.mod}" selected>${hx(x.mod)}</option>`)+Object.entries(MOD).map(([k,v])=>`<option value="${k}"${+k===x.mod?' selected':''}>${v}</option>`).join('')}</select></label><label>Symbol rate, Msym/s${inp(base+'.sr',x.sr,'w2','float')}</label><label>FEC outer${inp(base+'.fo',x.fo,'w','int')}</label><label>FEC inner${inp(base+'.fi',x.fi,'w','int')}</label></div>`}
 else b=`<input class="hex" data-p="${base}.hex" data-k="hex" value="${esc(x.hex)}">`;
 return`<div class="d"><h4>${hx(x.t)} · ${nm}<span class="sp"></span><button class="s x" data-a="rmdesc" data-b="${rm}" title="Delete descriptor">✕</button></h4>${b}</div>`}
function render(){
 const m=M;$('#start').classList.add('hid');$('#ed').classList.remove('hid');$('#bexp').classList.remove('hid');$('#fn').innerHTML=esc(fname)+(m.warn.length?` · <span class="er">${esc(m.warn.join('; '))}</span>`:' · <span class="ok">CRC OK</span>');
 const open=new Set([...document.querySelectorAll('details[open]')].map(d=>d.dataset.i));
 $('#ed').innerHTML=`<div class="row"><label>Network ID${inp('nid',m.nid,'w','int')}</label><label>Version (0–31)${inp('ver',m.ver,'w','int')}</label><label>Table ID${inp('tid',hx(m.tid),'w','hexn')}</label></div>
 <div id="nd">${m.netDescs.map((x,i)=>dRender(x,'netDescs.'+i,'net.'+i)).join('')}</div>
 <div class="row" style="margin-top:14px"><b>Transponders (<span id="cnt">${m.ts.length}</span>)</b><input id="q" placeholder="Search: TSID / frequency…" style="margin-left:auto"><button id="addts" class="p">+ transponder</button></div>
 <div id="tl">${m.ts.map((t,i)=>{const c=t.descs.find(d=>d.f!==undefined),sv=t.descs.filter(d=>d.s).reduce((a,d)=>a+d.s.length,0);
  return`<details data-i="${i}"${open.has(String(i))?' open':''} data-q="${t.tsid} ${t.onid} ${c?c.f:''}"><summary><b>TSID ${t.tsid}</b><span>ONID ${t.onid}</span><span>${c?c.f+' MHz':''}</span><span>${sv} services</span><span class="sp"></span><button class="s" data-a="dup" data-i="${i}">copy</button><button class="s x" data-a="rmts" data-i="${i}">✕</button></summary><div class="body"><div class="row" style="margin-top:8px"><label>TSID${inp(`ts.${i}.tsid`,t.tsid,'w','int')}</label><label>ONID${inp(`ts.${i}.onid`,t.onid,'w','int')}</label></div>${t.descs.map((x,j)=>dRender(x,`ts.${i}.descs.${j}`,`ts.${i}.${j}`,x.l&&!t.descs.some(d=>d.t===0x5F&&/^0000002[89]$/i.test(d.hex||'')))).join('')}<div class="row" style="margin-top:8px"><button class="s" data-a="adddesc" data-i="${i}" data-t="cable">+ cable (0x44)</button><button class="s" data-a="adddesc" data-i="${i}" data-t="svc">+ service list (0x41)</button><button class="s" data-a="adddesc" data-i="${i}" data-t="lcn">+ LCN (EACEM 0x83)</button><button class="s" data-a="adddesc" data-i="${i}" data-t="raw">+ raw</button></div></div></details>`}).join('')}</div>`}
function markDup(){const c={};const els=[...document.querySelectorAll('input.lcn')];els.forEach(e=>{const v=+e.value;if(v>0)c[v]=(c[v]||0)+1});els.forEach(e=>e.classList.toggle('dup',c[+e.value]>1));}
function setPath(path,val){const p=path.split('.');let o=M;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
document.addEventListener('input',e=>{const el=e.target,p=el.dataset.p;if(!p||!M)return;
 let v=el.value,k=el.dataset.k,ok=true;
 if(k==='chk')v=el.checked?1:0;
 else if(k==='int'||k==='lcn'){ok=/^\d+$/.test(v.trim())&&(k!=='lcn'||+v<=1023);v=+v}
 else if(k==='float'){ok=/^\d+(\.\d+)?$/.test(v.trim())}
 else if(k==='hexn'){ok=/^(0x)?[0-9a-f]{1,2}$/i.test(v.trim());v=parseInt(v,16)}
 else if(k==='hex'){try{B(v)}catch{ok=false}}
 el.classList.toggle('bad',!ok);if(ok)setPath(p,v);if(k==='lcn')markDup()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
 if(b.id==='addts'){M.ts.push({tsid:1,onid:M.ts.at(-1)?.onid??1,sec:M.ts.at(-1)?.sec??0,descs:[{t:0x41,s:[]}]});render();$('#tl').lastElementChild.open=true;return}
 if(!a)return;e.preventDefault();
 if(a==='rmts'){if(confirm('Delete transponder TSID '+M.ts[i].tsid+'?'))M.ts.splice(i,1)}
 else if(a==='dup'){M.ts.splice(i+1,0,JSON.parse(JSON.stringify(M.ts[i])))}
 else if(a==='rmdesc'){const[x,y,z]=b.dataset.b.split('.');if(x==='net')M.netDescs.splice(+y,1);else M.ts[+y].descs.splice(+z,1)}
 else if(a==='addsvc'){const o=b.dataset.b.split('.').reduce((o,k)=>o[k],M);o.s.push([1,0x19])}
 else if(a==='addlcn'||a==='lcnfill'){const o=b.dataset.b.split('.').reduce((o,k)=>o[k],M);const used=new Set(M.ts.flatMap(t=>t.descs.flatMap(d=>(d.l||[]).map(e=>e[2]))));
  let n=0;const nx=()=>{n++;while(used.has(n))n++;used.add(n);return n};
  if(a==='addlcn')o.l.push([1,1,nx(),0x1F]);
  else{const ti=+b.dataset.b.split('.')[1],have=new Set(o.l.map(e=>e[0]));M.ts[ti].descs.filter(d=>d.s).forEach(d=>d.s.forEach(([sid])=>{if(!have.has(sid)){have.add(sid);o.l.push([sid,1,nx(),0x1F])}}))}}
 else if(a==='rmlcn'){b.dataset.b.split('.').reduce((o,k)=>o[k],M).l.splice(i,1)}
 else if(a==='rmsvc'){b.dataset.b.split('.').reduce((o,k)=>o[k],M).s.splice(i,1)}
 else if(a==='adddesc'){const t=b.dataset.t;M.ts[i].descs.push(t==='lcn'?(()=>{const t=M.ts[i];if(!t.descs.some(d=>d.t===0x5F&&/^0000002[89]$/i.test(d.hex||'')))t.descs.push({t:0x5F,hex:'00000028'});let n=0;const used=new Set(M.ts.flatMap(t=>t.descs.flatMap(d=>(d.l||[]).map(e=>e[2]))));const nx=()=>{n++;while(used.has(n))n++;used.add(n);return n};return{t:0x83,l:t.descs.filter(d=>d.s).flatMap(d=>d.s.map(([sid])=>[sid,1,nx(),0x1F]))}})():t==='cable'?{t:0x44,f:'338',res:0x0FF,fo:2,mod:5,sr:'6.875',fi:15}:t==='svc'?{t:0x41,s:[]}:{t:0x83,hex:''})}
 render()});
document.addEventListener('input',e=>{if(e.target.id!=='q')return;const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#tl details').forEach(d=>d.classList.toggle('hid',!!q&&!d.dataset.q.toLowerCase().includes(q)))});
{const _r=render;render=function(){_r();markDup()}}
function load(text,name){try{M=parsePsi(text);fname=name;render()}catch(err){alert('Import error: '+err.message)}}
const fi=$('#file');['#bimp','#bimp2'].forEach(s=>$(s).onclick=()=>fi.click());
fi.onchange=()=>{const f=fi.files[0];if(f)f.text().then(t=>load(t,f.name));fi.value=''};
document.body.addEventListener('dragover',e=>{e.preventDefault();$('#start').classList.add('drag')});
document.body.addEventListener('dragleave',()=>$('#start').classList.remove('drag'));
document.body.addEventListener('drop',e=>{e.preventDefault();$('#start').classList.remove('drag');const f=e.dataTransfer.files[0];if(f)f.text().then(t=>load(t,f.name))});
$('#bexp').onclick=()=>{let txt;try{txt=buildPsi(M)}catch(err){return alert('Export error: '+err.message)}
 const d=new Date(),z=n=>String(n).padStart(2,'0'),stamp=`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
 const base=fname.replace(/\.psi$/i,'').replace(/_\d{8}_\d{6}$/,'');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=`${base}_${stamp}.psi`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
